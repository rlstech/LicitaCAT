name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/licitacat-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/licitacat-web

jobs:
  build-and-publish:
    name: Build and publish Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and publish web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy-portainer:
    name: Redeploy the Portainer stack
    needs: build-and-publish
    runs-on: ubuntu-latest
    env:
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}

    steps:
      - name: Trigger Portainer webhook
        if: ${{ env.PORTAINER_WEBHOOK_URL != '' }}
        run: |
          curl --fail --show-error --silent --max-time 60 \
            --request POST "$PORTAINER_WEBHOOK_URL"

      - name: Explain skipped deployment
        if: ${{ env.PORTAINER_WEBHOOK_URL == '' }}
        run: |
          echo "PORTAINER_WEBHOOK_URL is not configured; images were published but the stack was not redeployed."
