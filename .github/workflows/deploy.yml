name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/rlstech/licitacat-api
  WEB_IMAGE: ghcr.io/rlstech/licitacat-web

jobs:
  build-and-publish:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and publish web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy-portainer:
    name: Deploy to Portainer
    needs: build-and-publish
    runs-on: ubuntu-latest
    env:
      PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
      PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
      IMAGE_TAG: ${{ needs.build-and-publish.outputs.image_tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Deploy stack through Portainer API
        shell: bash
        run: |
          set -euo pipefail

          for name in PORTAINER_URL PORTAINER_API_KEY PORTAINER_ENDPOINT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: $name" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done

          STACK_NAME="licitacat"
          COMPOSE_CONTENT=$(cat docker-stack.yml)

          request() {
            local method=$1 url=$2 body=${3:-}
            local response
            if [ -n "$body" ]; then
              response=$(curl --fail-with-body --silent --show-error \
                --request "$method" \
                --header "X-API-Key: $PORTAINER_API_KEY" \
                --header "Content-Type: application/json" \
                --data "$body" "$url")
            else
              response=$(curl --fail-with-body --silent --show-error \
                --request "$method" \
                --header "X-API-Key: $PORTAINER_API_KEY" "$url")
            fi
            printf '%s' "$response"
          }

          stacks=$(request GET "$PORTAINER_URL/api/stacks")
          stack_id=$(jq -r --arg name "$STACK_NAME" '.[] | select(.Name == $name) | .Id // empty' <<< "$stacks")
          swarm_id=$(jq -r --arg name "$STACK_NAME" '.[] | select(.Name == $name) | .SwarmId // empty' <<< "$stacks")

          if [ -z "$stack_id" ] || [ -z "$swarm_id" ]; then
            echo "Stack '$STACK_NAME' was not found in the configured Portainer endpoint." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Preserve the existing stack variables (which hold production
          # credentials) and replace only the immutable image tags. Some
          # older Portainer stacks were first created outside Portainer and do
          # not retain their Env array; recover those values from their last
          # Swarm task without writing them to logs.
          stack=$(request GET "$PORTAINER_URL/api/stacks/$stack_id")
          stack_env=$(jq -c '.Env // []' <<< "$stack")
          services=$(request GET "$PORTAINER_URL/api/endpoints/$PORTAINER_ENDPOINT_ID/docker/services")
          tasks=$(request GET "$PORTAINER_URL/api/endpoints/$PORTAINER_ENDPOINT_ID/docker/tasks")

          recover_environment() {
            local service_name=$1 service_id container config env
            service_id=$(jq -r --arg name "$service_name" '.[] | select(.Spec.Name == $name) | .ID // empty' <<< "$services")
            [ -n "$service_id" ] || { printf '[]'; return; }

            while IFS= read -r container; do
              [ -n "$container" ] || continue
              config=$(request GET "$PORTAINER_URL/api/endpoints/$PORTAINER_ENDPOINT_ID/docker/containers/$container/json" || true)
              env=$(jq -c '[.Config.Env[]? | capture("^(?<name>[^=]+)=(?<value>.*)$")]' <<< "$config" 2>/dev/null || printf '[]')
              if jq -e 'any(.[]; .name == "DATABASE_URL" and .value != "")' <<< "$env" >/dev/null; then
                printf '%s' "$env"
                return
              fi
            done < <(jq -r --arg id "$service_id" '.[] | select(.ServiceID == $id) | .Status.ContainerStatus.ContainerID // empty' <<< "$tasks")
            printf '[]'
          }

          api_env=$(recover_environment licitacat_api)
          web_env=$(recover_environment licitacat_web)
          if ! jq -e 'any(.[]; .name == "DATABASE_URL" and .value != "")' <<< "$stack_env" >/dev/null \
            && ! jq -e 'any(.[]; .name == "DATABASE_URL" and .value != "")' <<< "$api_env" >/dev/null; then
            echo "No preserved production environment was found for the API stack." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          env_json=$(jq -n \
            --arg api_tag "$IMAGE_TAG" \
            --arg web_tag "$IMAGE_TAG" \
            --argjson stack "$stack_env" \
            --argjson api "$api_env" \
            --argjson web "$web_env" '
              [$api[], $web[], $stack[]]
              | map(select(.name != "API_IMAGE_TAG" and .name != "WEB_IMAGE_TAG"))
              | reduce .[] as $item ({}; .[$item.name] = $item.value)
              | .API_IMAGE_TAG = $api_tag
              | .WEB_IMAGE_TAG = $web_tag
              | to_entries | map({name: .key, value: .value})
            ')

          payload=$(jq -n \
            --arg content "$COMPOSE_CONTENT" \
            --argjson env "$env_json" \
            '{stackFileContent: $content, env: $env, prune: false, pullImage: true}')

          request PUT \
            "$PORTAINER_URL/api/stacks/$stack_id?endpointId=$PORTAINER_ENDPOINT_ID" \
            "$payload" >/dev/null

          echo "Deployed stack '$STACK_NAME' with API and web tag $IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Swarm services
        shell: bash
        run: |
          set -euo pipefail

          request() {
            curl --fail-with-body --silent --show-error \
              --header "X-API-Key: $PORTAINER_API_KEY" "$1"
          }

          # Give Swarm a short window to create replacement tasks, then report
          # only task state/error metadata (never service environment values).
          sleep 15
          services=$(request "$PORTAINER_URL/api/endpoints/$PORTAINER_ENDPOINT_ID/docker/services")
          tasks=$(request "$PORTAINER_URL/api/endpoints/$PORTAINER_ENDPOINT_ID/docker/tasks")

          for service_name in licitacat_api licitacat_web licitacat_worker; do
            service_id=$(jq -r --arg name "$service_name" '.[] | select(.Spec.Name == $name) | .ID // empty' <<< "$services")
            if [ -z "$service_id" ]; then
              echo "Missing Swarm service: $service_name" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            state=$(jq -c --arg id "$service_id" '[.[] | select(.ServiceID == $id) | {desired: .DesiredState, current: .Status.State, error: (.Status.Err // "")} ]' <<< "$tasks")
            echo "$service_name task state: $state"
            echo "### $service_name" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
            echo "$state" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

            if jq -e 'any(.[]; .current == "failed" or .current == "rejected")' <<< "$state" >/dev/null; then
              failed_container=$(jq -r --arg id "$service_id" '
                [.[] | select(.ServiceID == $id and (.Status.State == "failed" or .Status.State == "rejected"))
                 | .Status.ContainerStatus.ContainerID // empty] | first // empty
              ' <<< "$tasks")
              if [ -n "$failed_container" ]; then
                logs=$(request "$PORTAINER_URL/api/endpoints/$PORTAINER_ENDPOINT_ID/docker/containers/$failed_container/logs?stdout=true&stderr=true&tail=50" || true)
                safe_logs=$(printf '%s' "$logs" \
                  | sed -E 's#(postgres(ql)?://)[^[:space:]]+#\1***#g' \
                  | grep -Ei 'database_url|error|cannot find|module|permission|connect|econn|authentication' \
                  | tail -20 || true)
                if [ -n "$safe_logs" ]; then
                  echo "Startup error excerpt for $service_name:"
                  printf '%s\n' "$safe_logs"
                fi
              fi
              echo "Swarm reported a failed task for $service_name" >&2
              exit 1
            fi
          done
